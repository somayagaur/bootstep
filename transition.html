<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        .box{
            border: 10px solid;
            width: 100px;
            height: 100px;
            background: pink;
            transition-property: width,height,background;
            transition-duration: 2s,2s,2s;
            transition-timing-function: linear;
        }
        .box:hover{
            width: 500px;
            height: 500px;
            background: orange;
        }
        
    </style>
</head>
<body>
    <h1>transition</h1>
    <div  class="box">pninfosys</div>
</body>
</html>
